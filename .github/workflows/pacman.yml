name: Generate All Contribution Graphs

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Generate Snake SVGs (runs as root inside Docker)
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Ishaan2005
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Fix ownership permissions for the runner
      - name: Fix permissions for dist
        run: sudo chown -R $USER:$USER dist

      # 3. Generate Pac-Man & Galaga SVGs
      - name: Generate Arcade Games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Ishaan2005
          games: 'pacman,galaga'

# 4. Generate 3D Contribution Graphs
      - name: Generate 3D Contribution Graphs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Ishaan2005

      # 5. Copy 3D graphs into dist folder
      - name: Copy 3D SVGs to dist
        run: |
          mkdir -p dist
          cp -r profile-3d-contrib/* dist/

      # 6. Deploy everything to the output branch
      - name: Push all to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
