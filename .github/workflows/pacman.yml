name: Generate All Contribution Graphs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Generate Snake (Runs as root in Docker)
      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Ishaan2005
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Fix directory ownership permissions for the runner user
      - name: Fix permissions for dist
        run: sudo chown -R $USER:$USER dist

      # 3. Generate Pac-Man & Galaga
      - name: Generate Arcade Games
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Ishaan2005
          games: 'pacman,galaga'

      # 4. Deploy all SVGs together
      - name: Push all to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
